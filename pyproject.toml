[project]
name = "smithy"
version = "0.1.0"
description = "CLI que cria projetos novos com as ferramentas prontas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["questionary>=2.0"]

[project.scripts]
smithy = "smithy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smithy"]
